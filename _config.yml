# Professional summary (About section) — paragraphs support **markdown** emphasis
resume_summary_lead: >-
  I'm a backend engineer on Canva's **Billing Experience** team (Revenue Platform), building compliant,
  scalable billing, invoicing and tax systems. I work in **Java/Spring** on **AWS** — designing
  asynchronous, queue-driven services and the data models behind invoicing, tax and payments, with a
  focus on reliability and correctness in systems where money has to be exactly right.
resume_summary_more: >-
  Before Canva I spent three years at **WiseTech Global** hardening a secure remote-access gateway and
  SQL Server recovery workflows in **C#/.NET**. I hold a dual degree in Software Engineering (First Class
  Honours) and Finance from **UNSW**, taught data structures to 150+ students, and mentored 30+ developers
  through WiseTech's Earn & Learn program. I care about systems that behave predictably under pressure.

