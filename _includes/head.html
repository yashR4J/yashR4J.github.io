<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>

  <!-- Google font typography settings - defined in _config.yml -->
  <link href='https://fonts.googleapis.com/css?family=Lora:400,700|Open+Sans:400,300,800,700' rel='stylesheet' type='text/css'>

  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">

  <link rel="stylesheet" href="css/main.css">
  
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
  <link rel="icon" type="image/x-icon" href="favicon.png" />
  
  <script>
    // Apply theme immediately to prevent flash of unstyled content
    (function() {
      const savedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
    
    // Theme toggle functionality - wait for DOM to load
    document.addEventListener('DOMContentLoaded', function() {
      const themeToggle = document.getElementById('theme-toggle');
      const html = document.documentElement;
      
      if (themeToggle) {
        // Check for saved theme preference or default to 'light'
        const currentTheme = localStorage.getItem('theme') || 'light';
        html.setAttribute('data-theme', currentTheme);
        
        // Update button state
        updateButtonState(currentTheme);
        
        // Theme toggle click handler
        themeToggle.addEventListener('click', function() {
          const currentTheme = html.getAttribute('data-theme');
          const newTheme = currentTheme === 'light' ? 'dark' : 'light';
          
          html.setAttribute('data-theme', newTheme);
          localStorage.setItem('theme', newTheme);
          updateButtonState(newTheme);
        });
        
        function updateButtonState(theme) {
          const sunIcon = themeToggle.querySelector('.sun-icon');
          const moonIcon = themeToggle.querySelector('.moon-icon');
          
          if (!sunIcon || !moonIcon) {
            return;
          }
          
          if (theme === 'dark') {
            sunIcon.style.display = 'block';
            moonIcon.style.display = 'none';
          } else {
            sunIcon.style.display = 'none';
            moonIcon.style.display = 'block';
          }
        }
      }
    });
    
    // Click outside handler to close hover cards
    document.addEventListener('click', function(event) {
      const hoverCards = document.querySelectorAll('.hover-card.active');
      const iconButtons = document.querySelectorAll('.icon-btn');
      
      // Check if click is outside hover cards and not on icon buttons
      let clickedOnCard = false;
      let clickedOnButton = false;
      
      hoverCards.forEach(card => {
        if (card.contains(event.target)) {
          clickedOnCard = true;
        }
      });
      
      iconButtons.forEach(button => {
        if (button.contains(event.target)) {
          clickedOnButton = true;
        }
      });
      
      // Close all hover cards if clicking outside
      if (!clickedOnCard && !clickedOnButton) {
        hoverCards.forEach(card => {
          card.classList.remove('active');
        });
      }
    });
    
    // Courses toggle functionality
    function toggleCourses(button, index) {
      const coursesContent = document.getElementById('courses-' + index);
      const toggleText = button.querySelector('.toggle-text');
      const toggleIcon = button.querySelector('.toggle-icon');
      
      if (coursesContent.style.display === 'none') {
        coursesContent.style.display = 'block';
        toggleText.textContent = 'Hide Course List';
        toggleIcon.style.transform = 'rotate(180deg)';
        button.classList.add('active');
      } else {
        coursesContent.style.display = 'none';
        toggleText.textContent = 'Show Course List';
        toggleIcon.style.transform = 'rotate(0deg)';
        button.classList.remove('active');
      }
    }
    
    // Clubs toggle functionality
    function toggleClubs(button, index) {
      const clubsContent = document.getElementById('clubs-' + index);
      const toggleText = button.querySelector('.toggle-text');
      const toggleIcon = button.querySelector('.toggle-icon');
      
      if (clubsContent.style.display === 'none') {
        clubsContent.style.display = 'block';
        toggleText.textContent = 'Hide Clubs & Societies';
        toggleIcon.style.transform = 'rotate(180deg)';
        button.classList.add('active');
      } else {
        clubsContent.style.display = 'none';
        toggleText.textContent = 'Show Clubs & Societies';
        toggleIcon.style.transform = 'rotate(0deg)';
        button.classList.remove('active');
      }
    }
    
    // Hover card functionality
    function toggleCoursesHover(button, index) {
      const hoverCard = document.getElementById('courses-hover-' + index);
      const allHoverCards = document.querySelectorAll('.hover-card');
      
      // Close all other hover cards first
      allHoverCards.forEach(card => {
        if (card !== hoverCard) {
          card.classList.remove('active');
        }
      });
      
      // Toggle current hover card
      hoverCard.classList.toggle('active');
    }
    
    function toggleClubsHover(button, index) {
      const hoverCard = document.getElementById('clubs-hover-' + index);
      const allHoverCards = document.querySelectorAll('.hover-card');
      
      // Close all other hover cards first
      allHoverCards.forEach(card => {
        if (card !== hoverCard) {
          card.classList.remove('active');
        }
      });
      
      // Toggle current hover card
      hoverCard.classList.toggle('active');
    }
    
    function closeHoverCard(cardId) {
      const hoverCard = document.getElementById(cardId);
      hoverCard.classList.remove('active');
    }
    
    // Experience details hover functionality
    function toggleDetailsHover(button, index) {
      const hoverCard = document.getElementById(index);
      const allHoverCards = document.querySelectorAll('.hover-card');
      
      // Close all other hover cards first
      allHoverCards.forEach(card => {
        if (card !== hoverCard) {
          card.classList.remove('active');
        }
      });
      
      // Toggle current hover card
      hoverCard.classList.toggle('active');
    }
    
    // Project highlights hover functionality
    function toggleHighlightsHover(button, index) {
      const hoverCard = document.getElementById(index);
      const allHoverCards = document.querySelectorAll('.hover-card');
      
      // Close all other hover cards first
      allHoverCards.forEach(card => {
        if (card !== hoverCard) {
          card.classList.remove('active');
        }
      });
      
      // Toggle current hover card
      hoverCard.classList.toggle('active');
    }
    
    // Project description hover functionality
    function toggleDescriptionHover(button, index) {
      const hoverCard = document.getElementById(index);
      const allHoverCards = document.querySelectorAll('.hover-card');
      
      // Close all other hover cards first
      allHoverCards.forEach(card => {
        if (card !== hoverCard) {
          card.classList.remove('active');
        }
      });
      
      // Toggle current hover card
      hoverCard.classList.toggle('active');
    }
  </script>
</head>
