<footer class="site-footer">
  <div class="site-footer__inner">
    <p class="site-footer__text">© {{ site.time | date: "%Y" }} Yash Raj · Built with Jekyll, no frameworks.</p>
    <ul class="site-footer__links">
      {% if site.resume_social_links.resume_github_url %}
      <li><a class="site-footer__link" href="{{ site.resume_social_links.resume_github_url }}" target="_blank" rel="noopener">GitHub</a></li>
      {% endif %}
      {% if site.resume_social_links.resume_linkedin_url %}
      <li><a class="site-footer__link" href="{{ site.resume_social_links.resume_linkedin_url }}" target="_blank" rel="noopener">LinkedIn</a></li>
      {% endif %}
      <li><a class="site-footer__link" href="#top">Back to top ↑</a></li>
    </ul>
  </div>
</footer>
